<style>.glass-card {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 8px 32px 0 rgba(165, 60, 0, 0.05)
    }
body {
    background-color: #FFF7ED;
    /* Ivory Base */
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuA4nwVH2KBKD_DK02flVMH4dcm4OCVO4kIW-sxPhYxxOzf5HWlKCvbwQ-V6qI5aurz99VroC3c4p7t4mLdO4w6tgQkaiOaNcQVFPEVTDd18PozpgSYKnydWhVRB9L7gPUIC1qgLxRc1gj2X7kvZn_71G1ELeLR7iQkk8Czgag6nb7KJQAHrt71xmsNghK3WPvZswuYap1L_ndpbiK89CuCrredmYjxbFjELWrLa90O56pdIlAz5OqwgIw);
    background-size: cover;
    background-position: top center;
    background-attachment: fixed
    }
/* Custom radio button styling */
input[type="radio"]:checked + div {
    background-color: #FF7A3D;
    color: white;
    border-color: #FF7A3D
    }
input[type="radio"]:not(:checked) + div {
    background-color: transparent;
    color: #FF7A3D;
    border-color: #FF7A3D
    }</style>

<body class="antialiased text-on-background min-h-screen pb-24 font-body-md" data-alt="A delicate, elegant wedding invitation background featuring soft, semi-translucent watercolor floral arrangements in peach and blush tones at the corners of a creamy ivory canvas. The lighting is bright and airy, evoking a romantic, sophisticated, and light-mode aesthetic suitable for high-end digital stationery.">
<!-- Top Navigation (Admin Shell - Suppressed for Guest Flow, using custom back button) -->
<header class="flex items-center justify-between px-gutter py-base w-full z-50 sticky top-0 bg-surface/80 backdrop-blur-md border-b border-outline-variant/30">
<button class="p-2 text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight text-center flex-1">RSVP</h1>
<button class="p-2 text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">mail</span>
</button>
</header>
<main class="px-container-margin py-8 max-w-md mx-auto">
<!-- Header Text -->
<div class="text-center mb-8">
<span class="material-symbols-outlined text-primary-container mb-2" style="font-variation-settings: 'FILL' 1;">favorite</span>
<p class="font-headline-md text-headline-md text-on-surface mb-1">Kindly respond by</p>
<p class="font-title-lg text-title-lg text-primary-container">18 June 2027</p>
</div>
<!-- RSVP Form Card -->
<div class="glass-card rounded-3xl p-6 mb-8 space-y-8 relative overflow-hidden">
<!-- Decorative corner subtle glow -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-fixed opacity-30 rounded-full blur-2xl"></div>
<!-- Attendance Selection -->
<section>
<h2 class="font-body-lg text-body-lg text-center mb-4 text-on-surface">Will you be attending?</h2>
<div class="flex gap-4">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="attending" type="radio" value="yes"/>
<div class="rounded-2xl border-2 py-4 px-2 flex flex-col items-center justify-center transition-all duration-200">
<span class="material-symbols-outlined mb-1 text-2xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-md text-body-md text-center">Yes, can't wait!</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="attending" type="radio" value="no"/>
<div class="rounded-2xl border-2 py-4 px-2 flex flex-col items-center justify-center transition-all duration-200">
<span class="material-symbols-outlined mb-1 text-2xl" style="font-variation-settings: 'FILL' 0;">cancel</span>
<span class="font-body-md text-body-md text-center">Sorry, can't make it</span>
</div>
</label>
</div>
</section>
<!-- Number of Guests -->
<section>
<h2 class="font-body-lg text-body-lg text-center mb-4 text-on-surface">Number of Guests</h2>
<div class="flex items-center justify-center gap-6">
<button class="w-10 h-10 rounded-full border-2 border-primary-container text-primary-container flex items-center justify-center hover:bg-primary-container/10 transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">remove</span>
</button>
<span class="font-title-lg text-title-lg text-on-surface w-8 text-center">2</span>
<button class="w-10 h-10 rounded-full border-2 border-primary-container text-primary-container flex items-center justify-center hover:bg-primary-container/10 transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add</span>
</button>
</div>
</section>
<!-- Message to the Couple -->
<section>
<h2 class="font-body-lg text-body-lg mb-2 text-on-surface text-center">Message to the Couple <span class="text-on-surface-variant/70 text-sm">(optional)</span></h2>
<div class="relative">
<textarea class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-2xl p-4 min-h-[120px] focus:ring-2 focus:ring-primary-container/50 focus:border-primary-container/50 resize-none font-body-md text-on-surface placeholder:text-on-surface-variant/50 shadow-sm" placeholder="Share your warm wishes..."></textarea>
<span class="material-symbols-outlined absolute bottom-4 right-4 text-outline-variant/60" style="font-variation-settings: 'FILL' 0;">favorite</span>
</div>
</section>
</div>
<!-- Decorative Divider -->
<div class="flex items-center justify-center gap-2 mb-8 opacity-50">
<div class="h-px w-12 bg-primary-container"></div>
<span class="material-symbols-outlined text-primary-container text-sm" style="font-variation-settings: 'FILL' 0;">favorite</span>
<div class="h-px w-12 bg-primary-container"></div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-white font-title-lg text-title-lg py-4 rounded-full shadow-lg hover:shadow-xl hover:opacity-95 transition-all flex items-center justify-center gap-2">
            Send RSVP
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">send</span>
</button>
</main>
<!-- Bottom Navigation (Guest Flow - Validation active) -->
<nav class="docked full-width bottom-0 fixed rounded-t-3xl backdrop-blur-xl border-t border-outline-variant/10 shadow-[0_-4px_20px_rgba(165,60,0,0.08)] bg-surface/90 dark:bg-surface-container-low/90 fixed bottom-0 w-full z-50 flex justify-evenly items-center px-2 pb-8 pt-3 md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:bg-secondary-fixed-dim/20">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">verified</span>
<span class="font-label-md text-label-md">Vérification</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:bg-secondary-fixed-dim/20">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">mic</span>
<span class="font-label-md text-label-md">Enregistrement</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1.5 transition-all scale-90 duration-200">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">fact_check</span>
<span class="font-label-md text-label-md">Validation</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 hover:bg-secondary-fixed-dim/20">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">style</span>
<span class="font-label-md text-label-md">Carte</span>
</button>
</nav>
</body></html>
