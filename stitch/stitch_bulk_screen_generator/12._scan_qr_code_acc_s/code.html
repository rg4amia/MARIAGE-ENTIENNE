<div class="bg-black/60 flex-grow"></div>
<div class="flex h-64 sm:h-80 w-full">

<div class="relative w-64 sm:w-80 h-full border-2 border-primary/50 shadow-[0_0_0_9999px_rgba(0,0,0,0.6)] rounded-xl overflow-hidden">

<div class="absolute inset-0 flex items-center justify-center p-8 opacity-40 mix-blend-screen">
<img alt="QR Code example" class="w-full h-full object-contain filter invert" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCvO6PoXpAraeE5769Kb6r2Z00wrI-Cl7bunPcAps-HexDrPM_jRFur7nJ5se5oHQEMzp10t87XhhJ5UT4fV80HLCXMsWhhg8CXGfdAHaNtiUTtUdF-shHFkKQF6-me-LhiiwzZPeyQKjql6qItPCX8DFcUzjtK01XEAia9i0h1fKgey8mIL7fOuUs8QBm5h3XcZwHozwUeAVlWzmwIFdcm2ebWxXmkSLUA_0ffxwWc_3nRr8m3jLT5Bw"/>

<div class="bg-black/50 backdrop-blur-sm px-6 py-3 rounded-full mb-8 border border-white/10">
<p class="text-white font-medium flex items-center gap-2">
<span class="material-icons text-primary text-xl">qr_code_scanner</span>
                        Placez le QR code dans le cadre

<div class="flex gap-6 mt-4">

</div>
</div>

<div class="flex items-center justify-between relative">
<div class="absolute top-1/2 left-0 right-0 h-0.5 bg-gray-200 dark:bg-gray-700 -z-10"></div>
<div class="flex flex-col items-center gap-2 bg-card-light dark:bg-card-dark px-2">

<div class="w-2 h-2 rounded-full bg-white"></div>
</div>

</div>

<div class="w-6 h-6 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center border-4 border-white dark:border-card-dark">
</div>
<span class="text-[10px] font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wider">Validation</span>
</div>
<div class="flex flex-col items-center gap-2 bg-card-light dark:bg-card-dark px-2">
<div class="w-6 h-6 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center border-4 border-white dark:border-card-dark">
</div>
<span class="text-[10px] font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wider">Carte</span>
</div>
</div>
</div>
<style>
        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100%); }
        }.animate-\[scan_2s_ease-in-out_infinite_alternate\] {
            animation-name: scan;
            animation-duration: 2s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            height: 2px;--tw-translate-y: 250px; 
            transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
        }
        @media (min-width: 640px) {
             .animate-\[scan_2s_ease-in-out_infinite_alternate\] {
                --tw-translate-y: 310px;
             }
        }
    </style>
