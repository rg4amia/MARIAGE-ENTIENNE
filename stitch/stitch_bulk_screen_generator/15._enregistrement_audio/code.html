<style>
        .waveform-bar {
            animation: pulse-height 1.5s ease-in-out infinite alternate;
            transform-origin: bottom;
        }
        @keyframes pulse-height {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }
        .waveform-bar:nth-child(even) { animation-delay: 0.2s; }
        .waveform-bar:nth-child(3n) { animation-delay: 0.4s; }
        .waveform-bar:nth-child(4n) { animation-delay: 0.1s; }
        .waveform-bar:nth-child(5n) { animation-delay: 0.5s; }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md border-b border-outline-variant/30 docked full-width top-0 sticky flex items-center justify-between px-gutter py-base w-full z-50">

<p class="font-body-md text-on-surface-variant mb-12">Enregistrement en cours...</p>
<!-- Timer -->
<div class="text-5xl font-display-md text-primary mb-12 tracking-wider">
                00:27
            </div>

<div class="flex items-end justify-center h-32 w-full max-w-xs gap-1 mb-16 px-4">

<div class="w-2 bg-secondary-container rounded-t-full h-full waveform-bar" style="height: 60%;"></div>
<div class="w-2 bg-primary-container rounded-t-full h-full waveform-bar" style="height: 30%;"></div>
