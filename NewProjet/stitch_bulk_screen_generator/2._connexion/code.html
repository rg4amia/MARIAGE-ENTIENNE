<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface">
<main class="flex-grow flex items-center justify-center p-6 floral-bg relative" data-alt="Soft, romantic sunset floral illustration border at the bottom, warm orange and peach tones, elegant minimalist ivory background">
<div class="w-full max-w-md bg-surface-container-lowest/80 backdrop-blur-md rounded-2xl p-8 shadow-[0_8px_32px_rgba(255,122,61,0.05)] border border-outline-variant/30 relative z-10">

<div class="flex justify-center mb-4">
<span class="material-symbols-outlined text-primary-container text-[48px]" style="font-variation-settings: 'FILL' 1;">
                        favorite
                    </span>
</div>
<h1 class="font-display-md text-display-md text-primary tracking-tight mb-2">Bienvenue</h1>
<p class="text-on-surface-variant font-body-md">Connectez-vous pour accéder<br/>à votre espace mariage</p>
</div>
<form class="space-y-6">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email</label>
<input class="w-full bg-[#FFD6B3]/30 border-0 border-b border-[#D4AF37]/50 px-4 py-3 font-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 focus:border-[#FF8F7E] transition-colors rounded-t-lg" id="email" placeholder="exemple@mail.com" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Mot de passe</label>
<div class="relative">
<input class="w-full bg-[#FFD6B3]/30 border-0 border-b border-[#D4AF37]/50 px-4 py-3 font-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 focus:border-[#FF8F7E] transition-colors rounded-t-lg pr-10" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">
                                visibility_off
                            </span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="font-label-md text-label-md text-[#FF7A3D] hover:text-[#a53c00] transition-colors" href="#">Mot de passe oublié ?</a>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-primary-container hover:bg-[#FF8F7E] text-white font-body-lg text-body-lg py-3 rounded-lg transition-colors shadow-sm" type="submit">
                        Se connecter
                    </button>
</div>
</form>
<div class="mt-8 text-center">
<p class="font-body-md text-on-surface-variant">
                    Pas encore de compte ? 
                    <a class="text-[#FF7A3D] hover:text-[#a53c00] font-semibold transition-colors" href="#">Créer un compte</a>
</p>
</div>
