name: Deploy guest portal

on:
  push:
    branches: [main]
    paths:
      - 'backend/guest-portal-web/**'
      - '.github/workflows/deploy-guest-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: backend/guest-portal-web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
